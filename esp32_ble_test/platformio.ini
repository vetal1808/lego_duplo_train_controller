; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin32_lite

[env]
platform = espressif32@7.0.1
framework = arduino
lib_extra_dirs = ../lib
monitor_speed = 115200
; NimBLE: 0 none, 1 error, 2 warning, 3 info, 4 debug
; RETURN_CODE_TEXT: error text from returnCodeToString(), otherwise the log shows only the number
build_flags =
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
  -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT

; Pins in src/config.h are for the LOLIN32 Lite only (ESP32-C3 has no GPIO 25, 32, 33).
[env:lolin32_lite]
board = lolin32_lite
